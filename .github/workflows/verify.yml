name: Skriptpruefung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Syntax aller Shell-Skripte pruefen
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            echo "Pruefe $script"
            bash -n "$script"
          done
          bash -n config/ticket-display.conf.example
      - name: Extension und Tests prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/background.js
          node --check tests/refresh.test.cjs
          node -e 'const m = require("./extension/manifest.json"); if (m.manifest_version !== 3) process.exit(1)'
          node --test tests/refresh.test.cjs
      - name: Verzeichnisstruktur pruefen
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/INSTALLATION.md
          test -f docs/START-HIER.md
          test -f docs/TESTPLAN.md
          test -f config/ticket-display.conf.example
          test -f scripts/install.sh
          test -f scripts/browser-session.sh
          test -f scripts/refresh-browser.sh
          test -f scripts/tv-control.sh
          test -f scripts/diagnostics.sh
          test -f scripts/vnc-session.sh
          test -f docs/MIGRATION-CEVIK.md
          test -f docs/DIRECT-VNC.md
          test -f docs/RUSTDESK.md
          test -f scripts/install-rustdesk.sh
          test -f deploy/rustdesk-server/compose.yaml
          test -f deploy/rustdesk-server/.env.example
      - name: RustDesk deployment safety checks
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'sha256sum --check' scripts/install-rustdesk.sh
          grep -F 'systemctl disable --now rustdesk.service' scripts/install-rustdesk.sh
          ! grep -q 'install-rustdesk.sh' scripts/install.sh
          grep -q '/deploy/rustdesk-server/data/' .gitignore
          grep -q '/deploy/rustdesk-server/.env' .gitignore
